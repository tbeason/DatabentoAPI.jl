name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1']
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v3

      # DatabentoBinaryEncoding.jl is unregistered — clone it as a sibling and
      # develop it before testing.
      - name: Clone DatabentoBinaryEncoding.jl
        shell: bash
        run: git clone --depth 1 https://github.com/tbeason/DatabentoBinaryEncoding.jl ../DatabentoBinaryEncoding.jl

      - name: Dev DatabentoBinaryEncoding.jl + instantiate
        shell: bash
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.develop(path="../DatabentoBinaryEncoding.jl")
            Pkg.instantiate()
          '

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1

      - uses: julia-actions/julia-processcoverage@v1

      - uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          fail_ci_if_error: false
